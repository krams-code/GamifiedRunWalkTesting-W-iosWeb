name: hakbanghero
description: "A gamified fitness tracker for running, walking and jogging."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0

  # UI & Animation
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.10        # Layered SVG character avatar rendering

  # Local Storage
  shared_preferences: ^2.3.5

  # ── GPS / Location (NEW) ──────────────────────────────────────────────────
  geolocator: ^13.0.4          # GPS speed + position stream
  permission_handler: ^11.3.1  # Runtime permission requests

  # ── Sudden mid-run challenge alarm ────────────────────────────────────────
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/character/
    - assets/images/character/female/
    - assets/images/character/female/clothes/
    - assets/images/character/hair/
    - assets/images/character/face/
    - assets/images/character/clothes/
    - assets/images/guide/
    - assets/fonts/
    - assets/animations/
    - assets/animations/lottie/
    - assets/audio/
    - assets/images/icons/
    - assets/images/icons/items/
    - assets/images/warmup/
    - assets/images/maps/
    - assets/images/heroes/sprout/underweight/
    - assets/images/heroes/sprout/normal/
    - assets/images/heroes/sprout/overweight/
    - assets/images/heroes/sprout/obese/
    - assets/images/heroes/ember/underweight/
    - assets/images/heroes/ember/normal/
    - assets/images/heroes/ember/overweight/
    - assets/images/heroes/ember/obese/
    - assets/images/heroes/blaze/underweight/
    - assets/images/heroes/blaze/normal/
    - assets/images/heroes/blaze/overweight/
    - assets/images/heroes/blaze/obese/
    - assets/images/heroes/nova/underweight/
    - assets/images/heroes/nova/normal/
    - assets/images/heroes/nova/overweight/
    - assets/images/heroes/nova/obese/
    - assets/images/heroes/frost/underweight/
    - assets/images/heroes/frost/normal/
    - assets/images/heroes/frost/overweight/
    - assets/images/heroes/frost/obese/
